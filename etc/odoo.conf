[options]

; ====================
; | Paths            |
; ====================
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo

; ====================
; | Database         |
; ====================
db_host = postgres-runtime
db_port = 1920
db_user = odoo
db_password =
db_name = omc_v19_prod
dbfilter = omc_v19_prod

; ====================
; | Security         |
; Credentials are injected at runtime and never written to this file.
; ====================
admin_passwd =
list_db = False

; ====================
; | HTTP             |
; Each instance uses its own ports, mirrored on the reverse proxy entry.
; ====================
http_port = 8101
gevent_port = 8201
proxy_mode = True

; ====================
; | Language         |
; ====================
lang = es_MX

; ====================
; | Demo data        |
; Omitted by default on new instances.
; ====================
without_demo = all

; ====================
; | Logging          |
; ====================
logfile = /var/log/odoo/odoo-server.log
log_level = info

; ====================
; | Development      |
; Uncomment to enable hot reload, debug toolbar and view reloading.
; Development environments only, never in production.
; ====================
; dev_mode = reload,qweb,werkzeug,xml

; ====================
; | Workers          |
; ====================
; workers = 2
; limit_memory_soft = 2147483648
; limit_memory_hard = 2684354560
; limit_time_cpu = 60
; limit_time_real = 120
